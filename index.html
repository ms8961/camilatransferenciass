    <style>
        :root {
            --primary: #d946ef;
            --primary-dark: #2e1065;
            --accent: #f472b6;
            --bg-dark: #0f071a;
            --card-dark: #1e0c33;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-light: #fdf4ff;
            --text-muted: #d8b4fe;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-light); 
            line-height: 1.7;
            padding-bottom: 100px;
            background-image: radial-gradient(circle at 2px 2px, rgba(217, 70, 239, 0.07) 1px, transparent 0);
            background-size: 30px 30px;
        }

        header {
            background: rgba(15, 7, 26, 0.85);
            backdrop-filter: blur(12px);
            padding: 18px;
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
            text-align: center;
        }
        .brand { font-weight: 800; color: var(--accent); letter-spacing: 1px; font-size: 1rem; text-transform: uppercase; }

        main { max-width: 850px; margin: 0 auto; padding: 20px; }

        section { 
            background: var(--card-dark); padding: 40px 30px; 
            border-radius: 32px; margin-bottom: 35px; box-shadow: var(--shadow);
            border: 1px solid var(--glass-border);
        }

        h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 3rem; font-weight: 800; color: white; text-align: center; margin-bottom: 10px; }
        h1 span { position: relative; display: inline-block; color: var(--accent); }
        h1 span::after { content: ''; position: absolute; bottom: 8px; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 2px; box-shadow: 0 0 10px var(--primary); }

        h2 { font-weight: 800; margin-bottom: 25px; color: white; text-align: center; font-size: 1.8rem; }
        .divider { width: 60px; height: 5px; background: linear-gradient(90deg, var(--primary), var(--accent)); margin: -15px auto 30px; border-radius: 10px; box-shadow: 0 0 8px var(--primary); }

        .phone-gallery {
            display: flex;
            gap: 25px;
            overflow-x: auto;
            padding: 20px 10px;
            scrollbar-width: none;
        }
        .phone-gallery::-webkit-scrollbar { display: none; }

        .iphone-mockup {
            position: relative;
            width: 200px;
            height: 400px;
            background: #000;
            border: 6px solid #1a1a1a;
            border-radius: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            flex-shrink: 0;
            overflow: hidden;
            transition: var(--transition);
        }
        .iphone-mockup:hover { transform: translateY(-10px); }

        .iphone-screen { width: 100%; height: 100%; background: #1e0c33; position: relative; }
        .iphone-screen img { width: 100%; height: 100%; object-fit: cover; }

        .iphone-notch {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 18px;
            background: #000;
            border-radius: 10px;
            z-index: 10;
        }

        .features-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 40px; }
        .feature-card { background: var(--glass); padding: 35px 20px; border-radius: 20px; text-align: center; border: 1px solid var(--glass-border); transition: var(--transition); }
        .feature-card i { font-size: 2.2rem; color: var(--accent); margin-bottom: 15px; display: block; }
        .feature-card h4 { font-weight: 700; color: white; }

        .social-buttons-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 20px; }
        .btn-wa, .btn-fb { display: inline-flex; align-items: center; gap: 12px; color: white; padding: 18px 30px; border-radius: 100px; text-decoration: none; font-weight: 800; transition: 0.3s; font-size: 0.9rem; }
        .btn-wa { background: #25D366; }
        .btn-fb { background: #1877F2; }

        .dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: #2e1065; border: 1px solid var(--glass-border); border-radius: 100px; padding: 15px 25px; display: flex; justify-content: space-between; z-index: 2000; box-shadow: 0 10px 40px rgba(0,0,0,0.5); backdrop-filter: blur(15px); }
        .dock-item { color: var(--text-light); text-decoration: none; text-align: center; font-size: 0.7rem; }
        .dock-item i { font-size: 1.4rem; display: block; color: var(--accent); margin-bottom: 4px; }

        @media (min-width: 768px) { .features-grid { grid-template-columns: repeat(4, 1fr); } }
    </style>
</head>
